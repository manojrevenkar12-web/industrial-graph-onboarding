# The simulated plant. The platform never reads this file; it only sees the exports the plant writes.
dev:
  plant: "Rheinhafen refinery (simulated)"
  units: [21, 22, 23, 31, 32]
  equipment_per_unit: [9, 13]
  classes: {pump: 0.34, compressor: 0.1, heat_exchanger: 0.2, vessel: 0.16, fan: 0.2}
  pump_pairs: 0.6               # share of pumps installed as duty/standby pairs (A/B)
  independent_loop: 0.38        # instruments whose loop number is not the equipment number
  historian_formats: {"{u}{t}{l}.PV": 0.4, "{u}-{t}-{l}": 0.35, "U{u}_{t}_{l}_PV": 0.25}
  generic_description: 0.3      # "PRESSURE" instead of naming the equipment
  german_description: 0.35
  pid_coverage: 0.85
  days_backfill: 60
  days_project: 120
  failure_rate: 0.35            # per rotating machine over the project window
  preventive_per_equipment: 1.2
  errors:
    renamed_tag: 0.06
    rename_to_internal_id: 0.5  # of renamed tags, share whose new name is an internal id
    description_only: 0.07
    unit_mismatch: 0.05
    duplicate_equipment: 0.07
    ocr_noise: 0.15
    wrong_wo_equipment: 0.12
    wo_mentions_equipment: 0.8
  operations:                   # incidents after go-live
    extractor_outage: 2
    rename_after_golive: 4
    flatline: 3
  agent:
    questions: 80
    out_of_scope: 0.15
heldout:
  plant: "Nordsee gas terminal (simulated)"
  units: [41, 42, 43, 51, 52, 53]
  equipment_per_unit: [10, 15]
  independent_loop: 0.45
  generic_description: 0.38
  german_description: 0.55
  pid_coverage: 0.8
  error_scale: 1.4
  historian_formats: {"{u}{t}{l}.PV": 0.3, "{u}-{t}-{l}": 0.3, "U{u}_{t}_{l}_PV": 0.4}
